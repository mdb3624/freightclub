spring:
  test:
    enabled: true # Enables TestAuthController for E2E test authentication
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freightclub_test?currentSchema=freightclub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: freightclub
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    placeholders:
      login_lookup_password: ${DB_LOGIN_PASSWORD:freightclub_login}
      runtime_password: ${DB_PASSWORD:postgres}
      super_user_read_password: ${DB_SUPER_USER_READ_PASSWORD:freightclub_super_read}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 0

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: ${PORT:9091}

app:
  cookie:
    secure: false  # Tests run on HTTP localhost
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000,http://localhost:9090,http://localhost:9091}
  hibp:
    # Disabled by default so the automated suite is deterministic and network-independent.
    # US-866 AC-5's real-call verification is a separate, manual one-off check (see PR evidence),
    # not part of the routine Docker Pre-Test Protocol run.
    enabled: ${HIBP_ENABLED:false}
  login-lookup:
    username: ${DB_LOGIN_USER:freightclub_login_lookup}
    password: ${DB_LOGIN_PASSWORD:freightclub_login}
  super-user-read:
    username: ${DB_SUPER_USER_READ_USER:freightclub_super_user_read}
    password: ${DB_SUPER_USER_READ_PASSWORD:freightclub_super_read}
  jwt:
    secret: ${APP_JWT_SECRET:test-secret-32-chars-minimum-here}
    issuer: ${JWT_ISSUER:freightclub}
    audience: ${JWT_AUDIENCE:freightclub-api}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
