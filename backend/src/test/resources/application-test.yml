spring:
  dotenv:
    enabled: true
    file: .env.test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freightclub_db?currentSchema=freightclub}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:N1kk101!}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      format_sql: true
      use_sql_comments: true
    show-sql: false
    properties:
      hibernate.hbm2ddl.import_files_sql_extractor: org.hibernate.tool.schema.internal.script.SingleLineSqlScriptExtractor
      hibernate.dialect.fetch_size: 50
      hibernate.jdbc.batch_size: 20
      hibernate.hbm2ddl.auto: none
      hibernate.schema_update.unique_constraint_strategy: skip
      jakarta.persistence.schema-generation.scripts.action: none
      jakarta.persistence.schema-generation.database.action: none

  flyway:
    enabled: true
    schemas: freightclub
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:N1kk101!}}
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    placeholders:
      test_mode: 'true'
      login_lookup_password: ${DB_LOGIN_PASSWORD:freightclub_login}
      runtime_password: ${DB_PASSWORD:N1kk101!}
      super_user_read_password: ${DB_SUPER_USER_READ_PASSWORD:freightclub_super_read}

  sql:
    init:
      mode: never

  mail:
    host: localhost
    port: 3025

  security:
    user:
      name: test-user
      password: test-password

app:
  login-lookup:
    username: ${DB_LOGIN_USER:freightclub_login_lookup}
    password: ${DB_LOGIN_PASSWORD:freightclub_login}
  super-user-read:
    username: ${DB_SUPER_USER_READ_USER:freightclub_super_user_read}
    password: ${DB_SUPER_USER_READ_PASSWORD:freightclub_super_read}
  jwt:
    secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    issuer: freightclub-test
    audience: freightclub-api-test
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  default-tenant-id: 00000000-0000-0000-0000-000000000001
  cors:
    allowed-origins: http://localhost
  eia:
    enabled: false
  hibp:
    # Disabled by default so @SpringBootTest suites are deterministic and network-independent.
    # US-866 AC-5's real-call verification is a separate, manual one-off check, not part of
    # the routine automated suite.
    enabled: false
  storage:
    path: ${java.io.tmpdir}/freightclub-test-uploads

server:
  port: 0

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.test.context.cache: DEBUG
    com.freightclub.security.TenantContextHolder: DEBUG