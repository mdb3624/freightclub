<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#22D3EE"/>

  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#22D3EE" letter-spacing="3">ARTICLE 1 / 6</text>
  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#F8FAFC">Model-Tiered Delegation</text>
  <text x="80" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#94A3B8">Stop paying premium prices for grunt work</text>

  <!-- 3 tier bars -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="240" width="1040" height="100" rx="10" fill="#0F2A24"/>
    <circle cx="130" cy="290" r="22" fill="#34D399"/>
    <text x="130" y="298" text-anchor="middle" font-size="20" fill="#052E1F" font-weight="bold">L</text>
    <text x="175" y="278" font-size="24" font-weight="bold" fill="#F8FAFC">Lightweight — Retrieval &amp; fan-out</text>
    <text x="175" y="308" font-size="18" fill="#94A3B8">Mapping modules, parsing logs, summarizing — zero architectural calls</text>

    <rect x="80" y="355" width="1040" height="100" rx="10" fill="#241E3B"/>
    <circle cx="130" cy="405" r="22" fill="#A78BFA"/>
    <text x="130" y="413" text-anchor="middle" font-size="20" fill="#1E1533" font-weight="bold">M</text>
    <text x="175" y="393" font-size="24" font-weight="bold" fill="#F8FAFC">Mid-tier — Day-to-day implementation</text>
    <text x="175" y="423" font-size="18" fill="#94A3B8">Feature work, targeted debugging, test authoring — most execution lives here</text>

    <rect x="80" y="470" width="1040" height="100" rx="10" fill="#3B1E1E"/>
    <circle cx="130" cy="520" r="22" fill="#FB923C"/>
    <text x="130" y="528" text-anchor="middle" font-size="20" fill="#3B1300" font-weight="bold">T</text>
    <text x="175" y="508" font-size="24" font-weight="bold" fill="#F8FAFC">Top-tier — Architecture &amp; irreversible calls</text>
    <text x="175" y="538" font-size="18" fill="#94A3B8">Multi-file refactors, security boundaries — expensive to unwind if wrong</text>
  </g>

  <text x="80" y="600" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="italic" fill="#CBD5E1">The rule: would a wrong answer cost an afternoon, or a week?</text>
</svg>
