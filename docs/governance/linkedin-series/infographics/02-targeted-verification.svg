<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#34D399"/>

  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#34D399" letter-spacing="3">ARTICLE 2 / 6</text>
  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#F8FAFC">Targeted Verification vs.</text>
  <text x="80" y="196" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#F8FAFC">Full Rebuilds</text>

  <!-- two-column comparison -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="240" width="500" height="220" rx="10" fill="#1E293B"/>
    <text x="110" y="280" font-size="22" font-weight="bold" fill="#7DD3FC">DURING ITERATION</text>
    <text x="110" y="320" font-size="19" fill="#E2E8F0">→ One test class</text>
    <text x="110" y="352" font-size="19" fill="#E2E8F0">→ Already-running DB container</text>
    <text x="110" y="384" font-size="19" fill="#E2E8F0">→ No teardown, no rebuild</text>
    <text x="110" y="424" font-size="18" fill="#64748B">Proves the one thing that changed</text>

    <rect x="620" y="240" width="500" height="220" rx="10" fill="#1E293B"/>
    <text x="650" y="280" font-size="22" font-weight="bold" fill="#FDBA74">BEFORE MERGE</text>
    <text x="650" y="320" font-size="19" fill="#E2E8F0">→ Clean volumes, cold rebuild</text>
    <text x="650" y="352" font-size="19" fill="#E2E8F0">→ Full stack restart + health check</text>
    <text x="650" y="384" font-size="19" fill="#E2E8F0">→ Entire suite, no exceptions</text>
    <text x="650" y="424" font-size="18" fill="#64748B">Non-negotiable, every merge</text>
  </g>

  <text x="600" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#34D399">902 / 0 / 0 / 0</text>
  <text x="600" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94A3B8">tests run · failures · errors · skipped (last full protocol run)</text>
</svg>
