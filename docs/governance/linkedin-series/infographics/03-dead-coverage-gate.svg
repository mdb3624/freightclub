<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E1520"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#F87171"/>

  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#F87171" letter-spacing="3">ARTICLE 3 / 6</text>
  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#F8FAFC">The Coverage Gate That</text>
  <text x="80" y="196" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#F8FAFC">Had Been Silently Dead</text>

  <!-- lifecycle diagram -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="250" width="300" height="80" rx="10" fill="#1E293B"/>
    <text x="230" y="285" text-anchor="middle" font-size="20" fill="#E2E8F0">mvn test</text>
    <text x="230" y="312" text-anchor="middle" font-size="15" fill="#64748B">← what CI actually ran</text>

    <text x="410" y="300" text-anchor="middle" font-size="28" fill="#64748B">✗ →</text>

    <rect x="460" y="250" width="300" height="80" rx="10" fill="#3B1E1E"/>
    <text x="610" y="285" text-anchor="middle" font-size="20" fill="#FCA5A5">mvn verify</text>
    <text x="610" y="312" text-anchor="middle" font-size="15" fill="#94A3B8">← where jacoco:check lived</text>

    <text x="840" y="300" text-anchor="middle" font-size="20" fill="#64748B">never reached</text>
  </g>

  <text x="80" y="410" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#E2E8F0">Every "coverage passed" sign-off, for weeks, was reading a report</text>
  <text x="80" y="446" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#E2E8F0">that was never actually gating anything.</text>

  <text x="600" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#34D399">69.49%</text>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94A3B8">real branch coverage, once the gate actually ran</text>
</svg>
