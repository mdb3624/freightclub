<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1A1420"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#C084FC"/>

  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C084FC" letter-spacing="3">ARTICLE 4 / 6</text>
  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#F8FAFC">The Privilege That Quietly</text>
  <text x="80" y="196" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#F8FAFC">Defeated Our Security Model</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="240" width="1040" height="70" rx="10" fill="#1E293B"/>
    <text x="105" y="283" font-size="21" fill="#E2E8F0">✅  RLS policies: written correctly, tested, reviewed</text>

    <rect x="80" y="322" width="1040" height="70" rx="10" fill="#3B1E1E"/>
    <text x="105" y="365" font-size="21" fill="#FCA5A5">❌  Runtime DB role: held BYPASSRLS since day one — walked past all of it</text>
  </g>

  <text x="600" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#94A3B8">Revoking it made RLS real for the first time —</text>
  <text x="600" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#94A3B8">and immediately surfaced a second, previously-hidden gap.</text>

  <rect x="80" y="530" width="1040" height="70" rx="10" fill="#241E3B"/>
  <text x="105" y="573" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#DDD6FE">Documented as tracked, open debt — not silently patched. That's the point of governance.</text>
</svg>
