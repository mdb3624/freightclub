<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg6)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#3B82F6"/>

  <text x="80" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#3B82F6" letter-spacing="3">ARTICLE 6 / 6 · CLOSER</text>
  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#F8FAFC">Five Mechanisms.</text>
  <text x="80" y="196" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#F8FAFC">One Governance System.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#E2E8F0">
    <rect x="80" y="235" width="1040" height="52" rx="8" fill="#1E293B"/>
    <text x="105" y="269">1️⃣  Model routing — no more top-tier spend on grunt work</text>

    <rect x="80" y="297" width="1040" height="52" rx="8" fill="#1E293B"/>
    <text x="105" y="331">2️⃣  Two-speed testing — fast iteration, non-negotiable merge gate</text>

    <rect x="80" y="359" width="1040" height="52" rx="8" fill="#1E293B"/>
    <text x="105" y="393">3️⃣  A CI gate verified to actually run, not just documented</text>

    <rect x="80" y="421" width="1040" height="52" rx="8" fill="#1E293B"/>
    <text x="105" y="455">4️⃣  A revoked privilege that exposed real, tracked security debt</text>

    <rect x="80" y="483" width="1040" height="52" rx="8" fill="#1E293B"/>
    <text x="105" y="517">5️⃣  Escalation that stops silent scope creep</text>
  </g>

  <text x="80" y="590" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="italic" fill="#94A3B8">Not "AI, but cheaper" — fewer tokens re-deriving context, plus a real audit trail.</text>
</svg>
